name: OMR - Sincronizar objetivas (planilha para Supabase)

# A planilha vence nas objetivas. Por padrao so SIMULA e mostra as divergencias
# no log; marque "gravar" para aplicar. Nunca altera as dissertativas.
on:
  workflow_dispatch:
    inputs:
      gravar:
        description: "Gravar no Supabase (desmarcado = so simular)"
        required: true
        type: boolean
        default: false
      disciplina:
        description: "logica, ergonomia ou vazio para todas"
        required: false
        type: string
        default: ""

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omr-pilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar credenciais (a partir de Secrets)
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Sincronizar
        run: |
          ARGS=""
          if [ "$GRAVAR" = "true" ]; then ARGS="$ARGS --gravar"; fi
          if [ -n "$DISCIPLINA" ]; then ARGS="$ARGS --disciplina=$DISCIPLINA"; fi
          python sincronizar_planilha_supabase.py $ARGS
        env:
          GRAVAR: ${{ inputs.gravar }}
          DISCIPLINA: ${{ inputs.disciplina }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
